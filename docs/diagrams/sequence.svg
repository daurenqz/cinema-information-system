<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120">
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#111827}
      .subtitle{font:18px Arial,sans-serif;fill:#4b5563}
      .head{font:700 18px Arial,sans-serif;fill:#111827;text-anchor:middle}
      .msg{font:16px Arial,sans-serif;fill:#111827}
      .note{font:15px Arial,sans-serif;fill:#374151}
      .life{stroke:#9ca3af;stroke-width:2;stroke-dasharray:8 8}
      .arrow{stroke:#2563eb;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .return{stroke:#6b7280;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrowGray)}
      .box{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}
      .external{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}
      .alt{fill:#f9fafb;stroke:#9ca3af;stroke-width:1.6;rx:12}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1700" height="1120" fill="#ffffff"/>
  <text x="850" y="55" class="title" text-anchor="middle">Sequence Diagram — Онлайн билет сатып алу</text>
  <text x="850" y="88" class="subtitle" text-anchor="middle">UC-01 сценарийі: брондау → төлем → QR-билет</text>

  <!-- Participant headers -->
  <rect x="90" y="125" width="210" height="58" class="box"/>
  <text x="195" y="160" class="head">Клиент</text>

  <rect x="390" y="125" width="210" height="58" class="box"/>
  <text x="495" y="160" class="head">BookingUI</text>

  <rect x="700" y="125" width="230" height="58" class="box"/>
  <text x="815" y="160" class="head">BookingService</text>

  <rect x="1030" y="125" width="210" height="58" class="box"/>
  <text x="1135" y="160" class="head">Order</text>

  <rect x="1370" y="125" width="240" height="58" class="external"/>
  <text x="1490" y="153" class="head">PaymentGateway</text>
  <text x="1490" y="174" class="note" text-anchor="middle">сыртқы төлем жүйесі</text>

  <!-- Lifelines -->
  <line x1="195" y1="183" x2="195" y2="985" class="life"/>
  <line x1="495" y1="183" x2="495" y2="985" class="life"/>
  <line x1="815" y1="183" x2="815" y2="985" class="life"/>
  <line x1="1135" y1="183" x2="1135" y2="985" class="life"/>
  <line x1="1490" y1="183" x2="1490" y2="985" class="life"/>

  <!-- Messages -->
  <text x="280" y="235" class="msg">1. Сеанс пен орынды таңдау</text>
  <line x1="195" y1="245" x2="495" y2="245" class="arrow"/>

  <text x="565" y="290" class="msg">2. createOrder(user, screening, seat)</text>
  <line x1="495" y1="300" x2="815" y2="300" class="arrow"/>

  <text x="890" y="345" class="msg">3. Орынның қолжетімділігін тексеру</text>
  <line x1="815" y1="355" x2="1135" y2="355" class="arrow"/>

  <text x="910" y="397" class="msg">4. HELD, holdUntil = +10 мин</text>
  <line x1="1135" y1="407" x2="815" y2="407" class="return"/>

  <text x="570" y="450" class="msg">5. Тапсырыс №, сома, қалған уақыт</text>
  <line x1="815" y1="460" x2="495" y2="460" class="return"/>

  <text x="280" y="505" class="msg">6. Төлемді растау</text>
  <line x1="195" y1="515" x2="495" y2="515" class="arrow"/>

  <text x="570" y="557" class="msg">7. startPayment(orderId)</text>
  <line x1="495" y1="567" x2="815" y2="567" class="arrow"/>

  <text x="1110" y="610" class="msg">8. pay(orderId, amount)</text>
  <line x1="815" y1="620" x2="1490" y2="620" class="arrow"/>

  <text x="1110" y="662" class="msg">9. paymentResult(SUCCESS)</text>
  <line x1="1490" y1="672" x2="815" y2="672" class="return"/>

  <text x="900" y="715" class="msg">10. confirmPayment()</text>
  <line x1="815" y1="725" x2="1135" y2="725" class="arrow"/>

  <text x="890" y="767" class="msg">11. PAID + Ticket құру</text>
  <line x1="1135" y1="777" x2="815" y2="777" class="return"/>

  <text x="570" y="820" class="msg">12. showTicket(qrToken)</text>
  <line x1="815" y1="830" x2="495" y2="830" class="return"/>

  <text x="280" y="872" class="msg">13. QR-билетті көрсету</text>
  <line x1="495" y1="882" x2="195" y2="882" class="return"/>

  <!-- Alternative fragment -->
  <rect x="340" y="925" width="1120" height="130" class="alt"/>
  <text x="365" y="953" class="head" text-anchor="start">alt — балама жағдайлар</text>
  <text x="365" y="982" class="note">• Орын бос емес → Order жасалмайды, басқа орын таңдау ұсынылады.</text>
  <text x="365" y="1008" class="note">• Төлем сәтсіз → билет берілмейді; бронь мерзімі ішінде қайта төлеуге болады.</text>
  <text x="365" y="1034" class="note">• Бронь мерзімі өтіп кеткен төлем → refund(); қайталанған paymentId екінші билет жасамайды.</text>

  <text x="850" y="1090" class="subtitle" text-anchor="middle">Нәтиже: расталған төлем + жарамды бронь → бір ғана QR-билет</text>
</svg>