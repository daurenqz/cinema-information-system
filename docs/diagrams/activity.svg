<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250">
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#111827}
      .subtitle{font:18px Arial,sans-serif;fill:#4b5563}
      .task{fill:#ffffff;stroke:#2563eb;stroke-width:2.4;rx:18}
      .decision{fill:#fff7ed;stroke:#f97316;stroke-width:2.4}
      .txt{font:18px Arial,sans-serif;fill:#111827;text-anchor:middle}
      .small{font:15px Arial,sans-serif;fill:#4b5563;text-anchor:middle}
      .line{stroke:#374151;stroke-width:2.2;fill:none;marker-end:url(#arr)}
      .start{fill:#111827}
      .endOuter{fill:#ffffff;stroke:#111827;stroke-width:4}
      .endInner{fill:#111827}
      .label{font:15px Arial,sans-serif;fill:#374151}
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1500" height="1250" fill="#ffffff"/>
  <text x="750" y="55" class="title" text-anchor="middle">Activity Diagram — Онлайн билет сатып алу</text>
  <text x="750" y="88" class="subtitle" text-anchor="middle">Кинотеатр ақпараттық жүйесіндегі негізгі әрекеттер ағыны</text>

  <circle cx="750" cy="145" r="18" class="start"/>

  <rect x="570" y="190" width="360" height="72" class="task"/>
  <text x="750" y="233" class="txt">Фильм мен сеансты таңдау</text>
  <line x1="750" y1="163" x2="750" y2="190" class="line"/>

  <rect x="570" y="310" width="360" height="72" class="task"/>
  <text x="750" y="353" class="txt">Бос орындарды көрсету</text>
  <line x1="750" y1="262" x2="750" y2="310" class="line"/>

  <rect x="570" y="430" width="360" height="72" class="task"/>
  <text x="750" y="473" class="txt">Орынды таңдау</text>
  <line x1="750" y1="382" x2="750" y2="430" class="line"/>

  <polygon points="750,555 820,615 750,675 680,615" class="decision"/>
  <text x="750" y="610" class="txt">Орын бос па?</text>
  <line x1="750" y1="502" x2="750" y2="555" class="line"/>

  <text x="840" y="603" class="label">[иә]</text>
  <line x1="820" y1="615" x2="1010" y2="615" class="line"/>
  <rect x="1010" y="575" width="330" height="80" class="task"/>
  <text x="1175" y="608" class="txt">Орынды 10 минутқа</text>
  <text x="1175" y="632" class="txt">уақытша брондау</text>

  <text x="610" y="603" class="label">[жоқ]</text>
  <line x1="680" y1="615" x2="410" y2="615" class="line"/>
  <rect x="120" y="575" width="290" height="80" class="task"/>
  <text x="265" y="608" class="txt">Басқа орын таңдауды</text>
  <text x="265" y="632" class="txt">ұсыну</text>
  <line x1="265" y1="575" x2="265" y2="466" class="line"/>
  <line x1="265" y1="466" x2="570" y2="466" class="line"/>

  <rect x="1010" y="720" width="330" height="78" class="task"/>
  <text x="1175" y="754" class="txt">Төлем сұранысын жіберу</text>
  <text x="1175" y="779" class="small">PaymentGateway</text>
  <line x1="1175" y1="655" x2="1175" y2="720" class="line"/>

  <polygon points="1175,845 1245,905 1175,965 1105,905" class="decision"/>
  <text x="1175" y="900" class="txt">Төлем сәтті ме?</text>
  <line x1="1175" y1="798" x2="1175" y2="845" class="line"/>

  <text x="1260" y="892" class="label">[иә]</text>
  <line x1="1245" y1="905" x2="1365" y2="905" class="line"/>
  <line x1="1365" y1="905" x2="1365" y2="1020" class="line"/>
  <rect x="1170" y="1020" width="390" height="82" class="task"/>
  <text x="1365" y="1054" class="txt">Орынды сатылған деп белгілеу</text>
  <text x="1365" y="1079" class="txt">және QR-билет жасау</text>

  <text x="1040" y="892" class="label">[жоқ]</text>
  <line x1="1105" y1="905" x2="900" y2="905" class="line"/>
  <rect x="570" y="865" width="330" height="80" class="task"/>
  <text x="735" y="899" class="txt">Қате көрсету</text>
  <text x="735" y="924" class="small">бронь уақыты ішінде қайта төлеуге болады</text>

  <polygon points="735,985 795,1035 735,1085 675,1035" class="decision"/>
  <text x="735" y="1030" class="txt">Уақыт бітті ме?</text>
  <line x1="735" y1="945" x2="735" y2="985" class="line"/>

  <text x="815" y="1025" class="label">[жоқ]</text>
  <line x1="795" y1="1035" x2="930" y2="1035" class="line"/>
  <line x1="930" y1="1035" x2="930" y2="760" class="line"/>
  <line x1="930" y1="760" x2="1010" y2="760" class="line"/>

  <text x="625" y="1025" class="label">[иә]</text>
  <line x1="675" y1="1035" x2="500" y2="1035" class="line"/>
  <rect x="210" y="995" width="290" height="80" class="task"/>
  <text x="355" y="1028" class="txt">Броньды босату</text>
  <text x="355" y="1053" class="small">билет берілмейді</text>

  <circle cx="1365" cy="1170" r="28" class="endOuter"/>
  <circle cx="1365" cy="1170" r="16" class="endInner"/>
  <line x1="1365" y1="1102" x2="1365" y2="1142" class="line"/>

  <circle cx="355" cy="1170" r="28" class="endOuter"/>
  <circle cx="355" cy="1170" r="16" class="endInner"/>
  <line x1="355" y1="1075" x2="355" y2="1142" class="line"/>

  <text x="750" y="1225" class="subtitle" text-anchor="middle">Негізгі шарт: QR-билет тек жарамды бронь мен расталған төлем болғанда беріледі</text>
</svg>