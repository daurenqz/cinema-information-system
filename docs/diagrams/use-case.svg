<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#111827}
      .subtitle{font:18px Arial,sans-serif;fill:#4b5563}
      .actor{font:600 20px Arial,sans-serif;fill:#111827;text-anchor:middle}
      .uc{font:600 18px Arial,sans-serif;fill:#111827;text-anchor:middle}
      .small{font:15px Arial,sans-serif;fill:#4b5563}
      .line{stroke:#374151;stroke-width:2.2;fill:none}
      .system{fill:#f9fafb;stroke:#111827;stroke-width:3;rx:24}
      .oval{fill:#ffffff;stroke:#2563eb;stroke-width:2.5}
      .legend{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5;rx:14}
    </style>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="800" y="55" class="title" text-anchor="middle">Use Case Diagram — Кинотеатрдың ақпараттық жүйесі</text>
  <text x="800" y="88" class="subtitle" text-anchor="middle">Пайдаланушылардың жүйемен негізгі әрекеттесуі</text>

  <!-- System boundary -->
  <rect x="360" y="125" width="880" height="720" class="system"/>
  <text x="800" y="163" class="subtitle" text-anchor="middle">Кинотеатр ақпараттық жүйесі</text>

  <!-- Use cases -->
  <ellipse cx="650" cy="245" rx="190" ry="58" class="oval"/>
  <text x="650" y="239" class="uc">UC-01</text>
  <text x="650" y="264" class="uc">Онлайн билет сатып алу</text>

  <ellipse cx="650" cy="390" rx="190" ry="58" class="oval"/>
  <text x="650" y="384" class="uc">UC-02</text>
  <text x="650" y="409" class="uc">Кассада билет сату</text>

  <ellipse cx="650" cy="535" rx="190" ry="58" class="oval"/>
  <text x="650" y="529" class="uc">UC-03</text>
  <text x="650" y="554" class="uc">QR-билетті тексеру</text>

  <ellipse cx="990" cy="315" rx="190" ry="58" class="oval"/>
  <text x="990" y="309" class="uc">UC-04</text>
  <text x="990" y="334" class="uc">Сеанстарды басқару</text>

  <ellipse cx="990" cy="485" rx="190" ry="58" class="oval"/>
  <text x="990" y="479" class="uc">UC-05</text>
  <text x="990" y="504" class="uc">Рөлдерді басқару</text>

  <ellipse cx="990" cy="655" rx="190" ry="58" class="oval"/>
  <text x="990" y="649" class="uc">UC-06</text>
  <text x="990" y="674" class="uc">Сатылым есебін алу</text>

  <!-- Actors left -->
  <g transform="translate(145,225)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#111827" stroke-width="3"/>
    <line x1="0" y1="24" x2="0" y2="92" class="line"/>
    <line x1="-42" y1="48" x2="42" y2="48" class="line"/>
    <line x1="0" y1="92" x2="-38" y2="145" class="line"/>
    <line x1="0" y1="92" x2="38" y2="145" class="line"/>
    <text x="0" y="178" class="actor">Клиент</text>
  </g>

  <g transform="translate(145,485)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#111827" stroke-width="3"/>
    <line x1="0" y1="24" x2="0" y2="92" class="line"/>
    <line x1="-42" y1="48" x2="42" y2="48" class="line"/>
    <line x1="0" y1="92" x2="-38" y2="145" class="line"/>
    <line x1="0" y1="92" x2="38" y2="145" class="line"/>
    <text x="0" y="178" class="actor">Кассир</text>
  </g>

  <g transform="translate(145,745)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#111827" stroke-width="3"/>
    <line x1="0" y1="24" x2="0" y2="92" class="line"/>
    <line x1="-42" y1="48" x2="42" y2="48" class="line"/>
    <line x1="0" y1="92" x2="-38" y2="145" class="line"/>
    <line x1="0" y1="92" x2="38" y2="145" class="line"/>
    <text x="0" y="178" class="actor">Билет бақылаушысы</text>
  </g>

  <!-- Actors right -->
  <g transform="translate(1445,245)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#111827" stroke-width="3"/>
    <line x1="0" y1="24" x2="0" y2="92" class="line"/>
    <line x1="-42" y1="48" x2="42" y2="48" class="line"/>
    <line x1="0" y1="92" x2="-38" y2="145" class="line"/>
    <line x1="0" y1="92" x2="38" y2="145" class="line"/>
    <text x="0" y="178" class="actor">Әкімші</text>
  </g>

  <g transform="translate(1445,570)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#111827" stroke-width="3"/>
    <line x1="0" y1="24" x2="0" y2="92" class="line"/>
    <line x1="-42" y1="48" x2="42" y2="48" class="line"/>
    <line x1="0" y1="92" x2="-38" y2="145" class="line"/>
    <line x1="0" y1="92" x2="38" y2="145" class="line"/>
    <text x="0" y="178" class="actor">Менеджер</text>
  </g>

  <g transform="translate(800,900)">
    <rect x="-100" y="-35" width="200" height="70" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
    <text x="0" y="-4" class="actor">Төлем провайдері</text>
    <text x="0" y="20" class="small" text-anchor="middle">сыртқы жүйе</text>
  </g>

  <!-- Associations -->
  <line x1="250" y1="300" x2="460" y2="255" class="line"/>
  <line x1="250" y1="560" x2="460" y2="405" class="line"/>
  <line x1="250" y1="820" x2="460" y2="550" class="line"/>

  <line x1="1350" y1="320" x2="1180" y2="315" class="line"/>
  <line x1="1350" y1="320" x2="1180" y2="485" class="line"/>
  <line x1="1350" y1="645" x2="1180" y2="655" class="line"/>

  <line x1="800" y1="865" x2="690" y2="301" class="line"/>

  <!-- Notes -->
  <rect x="500" y="745" width="600" height="70" class="legend"/>
  <text x="800" y="773" class="small" text-anchor="middle">Негізгі ереже: бір орын бір сеансқа бір рет қана сатылады.</text>
  <text x="800" y="798" class="small" text-anchor="middle">Бронь 10 минут сақталады, QR-билет тек расталған төлемнен кейін беріледі.</text>
</svg>